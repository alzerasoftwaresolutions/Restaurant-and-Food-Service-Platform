# ==============================================================================
# RFSP Core Platform v1 — Staging Docker Compose Environment
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml logs -f rfsp-app
# ==============================================================================

version: '3.8'

services:
  # Staging PostgreSQL Database Container
  staging-db:
    image: postgres:16-alpine
    container_name: rfsp-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-rfsp_staging}
      POSTGRES_PASSWORD: ${PGPASSWORD:-rfsp_staging_secure_pass_2026}
      POSTGRES_DB: ${PGDATABASE:-rfsp_staging}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-rfsp_staging} -d ${PGDATABASE:-rfsp_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # RFSP Core Platform v1 Application Container
  rfsp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfsp-staging-app
    restart: unless-stopped
    depends_on:
      staging-db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: staging
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${PGUSER:-rfsp_staging}:${PGPASSWORD:-rfsp_staging_secure_pass_2026}@staging-db:5432/${PGDATABASE:-rfsp_staging}
      JWT_SECRET: ${JWT_SECRET:-staging_super_secure_jwt_secret_key_32bytes_minimum_2026}
      JWT_EXPIRES_IN: 24h
      PUBLIC_MENU_BASE_URL: ${PUBLIC_MENU_BASE_URL:-http://localhost:3000/menu}
      CORS_ORIGIN: "*"
      AUTO_SEED: "true"
      LOG_LEVEL: info
    volumes:
      - media_uploads_staging:/app/public/uploads

volumes:
  pgdata_staging:
    name: rfsp_pgdata_staging
  media_uploads_staging:
    name: rfsp_media_uploads_staging

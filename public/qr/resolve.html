<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resolving Digital Menu — RFSP</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      padding: 20px;
    }
    .resolve-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="resolve-card">
    <div id="loading-state">
      <div class="spinner"></div>
      <h2 style="font-size: 20px; margin-bottom: 8px;">Connecting to Digital Menu...</h2>
      <p style="color: #94a3b8; font-size: 14px;">Resolving your restaurant QR code</p>
    </div>

    <div id="error-state" style="display: none;">
      <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
      <h2 id="error-title" style="font-size: 22px; color: #f8fafc; margin-bottom: 10px;">QR Resolution Failed</h2>
      <p id="error-msg" style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 24px;"></p>
      <a href="/admin" class="btn btn-secondary" style="width: 100%;">Return to Administration</a>
    </div>
  </div>

  <script>
    async function resolveQR() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const qrCode = pathParts.length >= 2 ? pathParts[1] : '';

      if (!qrCode) {
        showError('Invalid QR Code', 'No QR code was provided in the URL.');
        return;
      }

      try {
        const response = await fetch(`/api/v1/public/qr/resolve/${qrCode}`);
        const data = await response.json();

        if (!data.success) {
          showError('Unable to Open Menu', data.error || 'This QR code is currently inactive or invalid.');
          return;
        }

        // Redirect to canonical public menu destination
        window.location.href = `/menu/${data.data.branchSlug}`;
      } catch (err) {
        showError('Network Error', 'Could not communicate with the restaurant platform. Please check your internet connection.');
      }
    }

    function showError(title, msg) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-msg').textContent = msg;
    }

    document.addEventListener('DOMContentLoaded', resolveQR);
  </script>
</body>
</html>
